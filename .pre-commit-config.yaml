repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: framework-unit-tests
        name: Framework unit tests (layers, docs, deps, teardown)
        description: >
          Runs the no-browser unit suite: four-layer boundaries, APP_CONTEXT.md /
          README.md / skills sync, dependency pinning, and the teardown registry.
        entry: python -m pytest -m unit -q --no-header -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
