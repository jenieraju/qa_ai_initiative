[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -s
    --strict-markers
    -ra
    --alluredir=output/allure-results
    --clean-alluredir
    --html=output/report.html
    --self-contained-html
    --junitxml=output/junit-results.xml

# Logging — captured logs are also attached to the Allure report by default.
log_cli = true
log_cli_level = INFO
log_level = INFO
log_file = output/logs/execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)-8s %(name)s:%(lineno)d %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

markers =
    e2e: End-to-end UI tests
    p0: Priority 0 — critical path
    p1: Priority 1 — high importance
    p2: Priority 2 — lower priority
    login: Login and authentication flows
    onboarding: New user onboarding flow
    unit: Fast unit tests for core framework utilities (no browser)
    ignore: Excluded from default test runs
    auth_profile(name): Load Playwright storage state from .auth/{name}.json
    xdist_group(name): Group tests for pytest-xdist loadgroup distribution
