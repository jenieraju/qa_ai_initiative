[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -s
    --alluredir=target/allure-results
    --strict-markers
    -ra
markers =
    e2e: End-to-end UI tests
    p0: Priority 0 — critical path
    p1: Priority 1 — high importance
    p2: Priority 2 — lower priority
    login: Login and authentication flows
    onboarding: New user onboarding flow
    ignore: Excluded from default test runs
    auth_profile(name): Load Playwright storage state from .auth/{name}.json
    xdist_group(name): Group tests for pytest-xdist loadgroup distribution
